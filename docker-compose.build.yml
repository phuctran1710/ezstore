services:
  backend:
    image: ezstore-backend:local
    pull_policy: never
    build: ./backend

  mcp-server:
    image: ezstore-mcp-server:local
    pull_policy: never
    build: ./mcp_server

  agent:
    image: ezstore-agent:local
    pull_policy: never
    build: ./agent

  order-mcp-server:
    image: ezstore-order-mcp-server:local
    pull_policy: never
    build: ./order_mcp_server

  order-agent:
    image: ezstore-order-agent:local
    pull_policy: never
    build: ./order_agent

  frontend:
    image: ezstore-frontend:local
    pull_policy: never
    build: ./frontend

  e2e:
    image: ezstore-e2e:local
    pull_policy: never
    build:
      context: ./frontend
      dockerfile: e2e/Dockerfile
