services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ezstore
      POSTGRES_PASSWORD: ezstore
      POSTGRES_DB: ezstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezstore"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/cshliu77/ezstore/backend:latest
    pull_policy: always
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ezstore
      DB_PASSWORD: ezstore
      DB_NAME: ezstore
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  mcp-server:
    image: ghcr.io/cshliu77/ezstore/mcp-server:latest
    pull_policy: always
    environment:
      BACKEND_URL: http://backend:8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      # 讓本機執行的 Agent（agents-cli playground / run / eval）也能連到 MCP Server
      - "${MCP_HOST_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  agent:
    image: ghcr.io/cshliu77/ezstore/agent:latest
    pull_policy: always
    environment:
      # 模型憑證二選一（見 .env.example）；沒設定時服務照常啟動，對話會回傳清楚的錯誤訊息
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      AGENT_MODEL: ${AGENT_MODEL:-gemini-3.8-flash}
      MCP_URL: http://mcp-server:8000/mcp
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-http://localhost:3000}
      # A2A agent card 對外公告的位址（Compose 內部網路）
      APP_URL: http://agent:8080
    # Chat UI 經 frontend 的 nginx /agent-api/ 轉發到 8080。
    # 另外只綁 127.0.0.1:8081，讓本機執行的 order_agent（playground / eval）
    # 能呼叫報價單 Agent 的 A2A 端點；不對外部網路開放，也避開 backend 的 8080。
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${AGENT_A2A_HOST_PORT:-8081}:8080"
    depends_on:
      - mcp-server

  frontend:
    image: ghcr.io/cshliu77/ezstore/frontend:latest
    pull_policy: always
    ports:
      - "3000:80"
    depends_on:
      - backend
      - mcp-server
      - agent

  e2e:
    image: ghcr.io/cshliu77/ezstore/e2e:latest
    pull_policy: always
    environment:
      BASE_URL: http://frontend:80
      API_URL: http://backend:8080
    depends_on:
      - frontend
    profiles:
      - test

volumes:
  pgdata:
